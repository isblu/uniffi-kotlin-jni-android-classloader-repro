[package]
name = "uniffi-bindgen-kotlin-jni-runtime"
version = "0.31.1"
description = "a multi-language bindings generator for rust (codegen and cli tooling)"
documentation = "https://mozilla.github.io/uniffi-rs"
homepage = "https://mozilla.github.io/uniffi-rs"
repository = "https://github.com/mozilla/uniffi-rs"
license = "MPL-2.0"
edition = "2021"
keywords = ["ffi", "bindgen"]

[dependencies]
anyhow = "1"
jni-sys = "0.4.1"
simd_cesu8 = "1.1.1"
uniffi = { git = "https://github.com/mozilla/uniffi-rs", rev = "c31f4bc025c7a31eae56b49107f50e6d38e76bc7", default-features = false }

[package.metadata.uniffi]
skip_parsing = true

[package.metadata.vendor]
# Copied verbatim from xerosf/chatr PR #74 (vendor/uniffi-bindgen-kotlin-jni-runtime).
upstream-revision = "c31f4bc025c7a31eae56b49107f50e6d38e76bc7"
upstream-path = "uniffi-bindgen-kotlin-jni/runtime"
